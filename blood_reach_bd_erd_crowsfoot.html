<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  DIVISIONS ||--o{ DISTRICTS : "one-to-many"
  DISTRICTS ||--o{ USERS : "one-to-many"
  DISTRICTS ||--o{ BLOOD_REQUESTS : "one-to-many"
  DISTRICTS ||--o{ HOSPITALS : "one-to-many"
  USERS ||--|| DONORS : "one-to-one"
  USERS ||--o{ BLOOD_REQUESTS : "one-to-many"
  USERS ||--o{ HOSPITALS : "one-to-many (admin)"
  USERS ||--o{ NOTIFICATIONS : "one-to-many"
  USERS ||--o{ AUDIT_LOGS : "one-to-many"
  HOSPITALS ||--o{ HOSPITAL_INVENTORY : "one-to-many"

  DIVISIONS {
    int division_id PK
    string name
  }
  DISTRICTS {
    int district_id PK
    string name
    int division_id FK
    float latitude
    float longitude
  }
  USERS {
    uuid user_id PK
    string name
    string email
    string password_hash
    string role
    int district_id FK
    timestamp created_at
  }
  DONORS {
    uuid donor_id PK
    uuid user_id FK
    string blood_group
    bool is_available
    date last_donated
    int total_donations
  }
  BLOOD_REQUESTS {
    uuid request_id PK
    uuid seeker_id FK
    string blood_group
    int quantity_units
    string urgency_level
    string status
    int district_id FK
  }
  HOSPITALS {
    uuid hospital_id PK
    string name
    int district_id FK
    uuid admin_user_id FK
    string contact_info
  }
  HOSPITAL_INVENTORY {
    uuid inv_id PK
    uuid hospital_id FK
    string blood_group
    int units_available
    timestamp updated_at
  }
  NOTIFICATIONS {
    uuid notif_id PK
    uuid recipient_id FK
    string type
    string message
    bool is_read
    timestamp sent_at
  }
  AUDIT_LOGS {
    uuid log_id PK
    uuid actor_id FK
    string action
    string entity_type
    uuid entity_id
    timestamp timestamp
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
